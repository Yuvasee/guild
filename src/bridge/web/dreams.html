<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dreams</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #fbfbf9; --raise: #ffffff; --ink: #1c1c1a; --soft: #6e6e68; --faint: #a6a69f; --line: #ecebe6;
  --code: #f3f2ed; --link: #2456d6; --ok: #3f9a6b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141413; --raise: #1b1b1a; --ink: #ecece8; --soft: #9d9d97; --faint: #65655f; --line: #282826;
    --code: #232321; --link: #86a8ff; --ok: #55b482;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width: 780px; margin: 0 auto; padding: 24px 16px 64px; }
#top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
h1 { margin: 0; font-size: 21px; font-weight: 700; }
#top a { font-size: 13px; color: var(--soft); text-decoration-color: var(--faint); text-underline-offset: 2px; }
.sub { margin: 4px 0 18px; font-size: 13px; color: var(--soft); }
#pins { display: flex; flex-direction: column; gap: 10px; }
.pin { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; min-width: 0; }
.pin h2 { margin: 0 0 6px; font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
.cmd { display: flex; gap: 8px; align-items: flex-start; }
.cmd pre { flex: 1; min-width: 0; margin: 0; background: var(--code); border-radius: 6px; padding: 6px 9px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 16em; overflow-y: auto; }
.cmd code { font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
.copy { flex: none; font: 12px -apple-system, BlinkMacSystemFont, sans-serif; color: var(--ink); background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.copy:hover { border-color: var(--faint); }
.copy.done { color: var(--ok); border-color: var(--ok); }
a.link { color: var(--link); overflow-wrap: anywhere; }
.note { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.meta { margin-top: 6px; font-size: 12px; color: var(--faint); overflow-wrap: anywhere; }
.empty { color: var(--soft); }
.dream { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 0; }
.dream h2 { margin: 0 0 2px; font-size: 16px; font-weight: 650; }
.dream .meta { margin: 0 0 8px; }
.dream p { margin: 0 0 10px; overflow-wrap: anywhere; }
.dream p:last-child { margin-bottom: 0; }
#dreams { display: flex; flex-direction: column; gap: 12px; }
</style>
</head>
<body>
<main>
  <div id="top"><h1>Dreams</h1><a href="/">← Guild</a></div>
  <p class="sub">Each lead's and the assistant's latest dream: impressions of their day, not facts.</p>
  <div id="dreams">
<!--DREAMS-->
  </div>
</main>
</body>
</html>
