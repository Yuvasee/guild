}

// Only what of the owner's is still open; the rest of their review history is in the tooltip.
function queueReviewWord(pr) {
  if (pr.resolve_threads.length) return "resolve " + pr.resolve_threads.length;
  if (pr.owner_open_threads) return pr.owner_open_threads + " open";
  return pr.merge_block ? "comment open" : "–";
}

function queueReviewWhy(pr) {
  const history = queueReviewHistory(pr);
  const blocked = pr.merge_block && !pr.resolve_threads.length ? "Your comments: " + pr.merge_block + ". " : "";
  const others = pr.open_threads > pr.owner_open_threads ? "; " + plural(pr.open_threads, "unresolved review thread") + " in all" : "";
  return blocked + history + others;
}

function queueReviewHistory(pr) {
  if (pr.resolve_threads.length) {
    const rest = pr.resolve_is_last ? ", and resolving them is all that keeps it from merging" : "; it waits on more than that to merge";
    return "every review thread you started has a reply" + rest;
  }
  if (pr.reviewed_at && pr.commits_since) {
    return "pushed since your review at " + fullTime(pr.reviewed_at) + ", " + (pr.reviewed_oid || "").slice(0, 9);
  }
  if (pr.reviewed_at) return "you pressed Publish " + fullTime(pr.reviewed_at) + " (" + pr.reviewed_by + ")";
  if (pr.owner_last_at) {
    const since = pr.commits_after_owner ? ", " + plural(pr.commits_after_owner, "commit") + " since" : "";
    return "your last comment or review: " + fullTime(pr.owner_last_at) + since;
  }
  if (pr.state === "published") return "published without your review here";
  return "you have not commented on it yet";
}

const QUEUE_APPROVAL_LEFT = {
  "ready to merge (lead)": "CI green, no conflicts, nothing of yours open: its lead may merge it without your review or a post, and is told so",
  "your comments open": "its lead settles your comments first, then it may merge",
  "resolve your threads": "every thread you started has a reply; resolving them is yours",
  "CI red": "it merges once its lead gets CI green",
  "CI pending": "it merges once CI is green",
  conflicts: "it merges once its lead resolves the conflicts",
  "blocked on GitHub": "GitHub blocks the merge: branch protection wants more, usually a person's review or a required check",
};

const QUEUE_APPROVAL_WORD = { "ready to merge (lead)": "ready (lead)", "your comments open": "your comments", "resolve your threads": "your threads" };

function queueApprovalWord(pr) {
  return pr.approvers.length ? QUEUE_APPROVAL_WORD[pr.approval_left] || "approved" : "–";
}

function queueApprovalWhy(pr) {
  if (!pr.approvers.length) return null;
  const by = "approved by " + pr.approvers.join(", ") + (pr.approval_left ? " · " + pr.approval_left : "") + ": ";
  const bot = pr.bot_approved && !pr.approved_by.length
    ? "only the review bot approved, no person yet" + (pr.merge_state === "BLOCKED" ? ", and branch protection may not count the review bot" : "") + "; "
    : "";
  return by + bot + (QUEUE_APPROVAL_LEFT[pr.approval_left] || "a draft, its owner marks it ready first");
}

function queueMergeWord(pr) {
  if (pr.merge_block) return "your comments";
  if (pr.approvers.length && pr.merge_state === "BLOCKED") return "blocked on GitHub";
  return pr.merge_state === "BEHIND" ? "behind " + pr.base : QUEUE_MERGE[pr.merge_state] || "–";
}

function queueMergeWhy(pr) {
  if (pr.merge_block) return "Your comments: " + pr.merge_block + "; whatever the approvals, it is not merged until they are settled";
  const botOnly = pr.merge_state === "BLOCKED" && pr.bot_approved && !pr.approved_by.length;
  const why = botOnly ? "branch protection wants a person's review; the review bot's may not count" : QUEUE_MERGE_WHY[pr.merge_state] || null;
  const asked = why && pr.conflict_asked_at ? "; its owner was asked to merge " + pr.base + " into it at " + fullTime(pr.conflict_asked_at) : "";
  const refused = pr.merge_path === "ready" ? "" : (why ? "; " : "") + "bridge refuses its merge until it is approved, CI is green and nothing of yours is open";
  return why || refused ? (why || "") + asked + refused : null;
}

function queueSlackWord(pr) {
  if (pr.post_link || pr.post_state === "posted") {
    return pr.posted_at ? "published " + age(state.now - pr.posted_at) + " ago" : "published";
  }
  // The send tool was called but no link came back: it probably went out, and the row must not claim it did.
  if (pr.post_state === "posted-link-unknown") return "sent?";
  return QUEUE_POSTS[pr.post_state] || "–";
}

function queueDocWord(pr) {
  if (pr.doc_url) return pr.doc_stale ? (pr.doc_updating ? "updating" : "older") : "open";
  return pr.large && pr.group !== "drafts" ? "none yet" : "–";
}

// Review detail lives in the doc link's tooltip only: rows stay one line.
function queueReviewMarksWhy(pr) {
  const parts = [];
  if (pr.reviews_ran.length) parts.push("reviews: " + pr.reviews_ran.join(", "));
  if (pr.reviews_gap) parts.push(pr.reviews_gap);
  return parts.join("; ");
}

function queueFolderWord(pr) {
  if (pr.worktree_url && pr.worktree_state === "ready") return pr.worktree_stale ? "older" : "open";
  if (pr.worktree_url) return pr.worktree_state === "dirty" ? "has changes" : pr.worktree_state;
  return pr.worktree_state || "–";
}

function queueLink(url, label, title) {
  const a = el("a", "", label);
  a.href = url;
  if (!url.startsWith("vscode:")) a.target = "_blank";
  if (title) a.title = title;
  return a;
}

function queueCell(row, content, cls, title) {
  const cell = el("td", cls);
  if (title) cell.title = title;
  cell.append(content);
  row.append(cell);
  return cell;
}

// One cell for the review post: the button until they publish, then where the post stands, and only a send in flight, stuck or
// dry run says more.
function renderQueueSlackCell(pr) {
  const stopped = pr.post_state === "failed" || pr.post_state === "interrupted";
  const action = el("td", stopped ? "action stuck" : "action");
  const word = queueSlackWord(pr);
  const posted = pr.post_link || pr.post_state === "posted";
  if (pr.can_publish && !posted && word === "–") {
    action.append(queuePublishButton(pr));
    return action;
  }
  action.title = pr.post_detail || (word === "–" ? "not published" : pr.posted_at ? "posted " + fullTime(pr.posted_at) : word);
  action.append(pr.post_link ? linkTo(pr.post_link, word) : word);
  if (pr.can_publish && !posted) action.append(" ", queuePublishButton(pr));
  if (pr.can_retry) action.append(" ", queueAction(pr, "Retry", "retry"));
  if (pr.can_repost) action.append(" ", queuePublishButton(pr, pr.post_state === "dry-run" ? "Post for real" : "Post again", "repost"));
  return action;
}

function renderQueueTableRow(pr) {
  const row = el("tr", "prrow" + (pr.group === "drafts" ? " drafts" : ""));
  const rank = rankOf(pr.ref);
  const rankCell = el("td", "place");
  if (rank && rank.mark) rankCell.append(rankMark(rank));
  row.append(rankCell);
  const name = el("td", "pr");
  name.append(linkTo(pr.url, pr.label, "ref"));
  // Ahead of the title, which the cell cuts; among the drafts the group's header already says it.
  if (pr.draft && pr.group !== "drafts") {
    const mark = el("span", "mark", "draft");
    mark.title = "a draft on GitHub";
    name.append(mark);
  }
  name.append(" ", el("span", "title", pr.title));
  const stackedOn = pr.stack_parent && state.reviews.prs.find((other) => other.ref === pr.stack_parent);
  name.title = pr.repo + "#" + pr.number + ": " + pr.title + " · " + pr.group_why
    + (stackedOn ? " · stacked on " + stackedOn.label : "")
    + (pr.depends_on_label ? " · merges after " + pr.depends_on_label : "");
  row.append(name);

  const under = pr.lead && pr.lead.toLowerCase() !== String(pr.owner).toLowerCase();
  const who = under ? pr.lead + " · " + pr.owner : pr.lead || pr.owner || "no session";
  const whoCell = el("td", pr.owner ? "who" : "who none");
  if (pr.owner_surface) {
    const go = el("button", "plain", who);
    go.title = "Go to " + (under ? "lead " + pr.lead + ", session " + pr.owner : who);
    go.onclick = () => jump(pr.owner_surface);
    whoCell.append(go);
  } else {
    whoCell.textContent = who;
  }
  whoCell.title = pr.owner ? (under ? "lead " + pr.lead + ", session " + pr.owner : "session " + who) : "no live session owns it";
  row.append(whoCell);

  queueCell(row, String(pr.loc), "num", pr.loc + " lines changed" + (pr.large ? ": large, so it gets a doc and a folder" : ""));
  const ci = QUEUE_CHECKS[pr.checks];
  queueCell(row, ci ? dot(ci) : "–", "ci", ci ? ci.why : "no CI");

  queueCell(row, queueReviewWord(pr), pr.resolve_threads.length ? "review yours" : "review", queueReviewWhy(pr));

  queueCell(row, queueApprovalWord(pr), "", queueApprovalWhy(pr));
  queueCell(row, queueMergeWord(pr), "", queueMergeWhy(pr));
  const docBehind = pr.doc_stale
    ? "doc at " + (pr.doc_at || "unknown") + ", PR at " + pr.pr_at + (pr.doc_updating ? "; its owner was asked to update it" : "")
    : pr.doc_url ? "the doc matches the PR's newest commit" : pr.large ? "its owner has not registered a doc yet" : null;
  const folder = queueFolderWord(pr);
  const folderWhy = pr.worktree_detail || (pr.worktree_path ? pr.worktree_path + (pr.worktree_stale ? ", behind the PR" : "") : null);
  const reviewCell = queueCell(row, pr.worktree_url ? queueLink(pr.worktree_url, folder, folderWhy) : folder, "", folderWhy);
  if (pr.doc_url) {
    const docWhy = [docBehind, queueReviewMarksWhy(pr)].filter(Boolean).join("; ");
    reviewCell.prepend(queueLink(pr.doc_url, pr.doc_stale ? "doc (older)" : "doc", docWhy), " · ");
  }

  row.append(renderQueueSlackCell(pr));
  // On a phone the row is a card that names each cell and drops the empty ones.
  [...row.children].forEach((cell, index) => {
    const key = QUEUE_COLUMNS[index][0];
    cell.classList.add("c-" + key);
    // A cut word still reads whole in the tooltip.
    const text = cell.textContent.trim();
    if (!["place", "pr", "action"].includes(key) && text && !String(cell.title || "").includes(text)) {
      cell.title = text + (cell.title ? ": " + cell.title : "");
    }
    const blank = ["", "–"].includes(cell.textContent.trim()) && !cell.querySelector(".dot, button");
    if (blank) cell.classList.add("blank");
  });
  return row;
}

function renderQueueGroup(title, prs, first) {
  const body = el("tbody");
  const head = el("tr");
  const cell = el("th", "group", title);
  cell.colSpan = QUEUE_COLUMNS.length;
  cell.append(el("span", "note", String(prs.length)));
  if (first && queueSort) {
    const reset = el("button", "unsort", "reset to ranking");
    reset.type = "button";
    reset.onclick = () => setQueueSort(null, "pr");
    cell.append(reset);
  }
  head.append(cell);
  body.append(head);
  prs.forEach((pr, index) => {
    const rows = [renderQueueTableRow(pr)];
    if (pr.resolve_threads.length) rows.push(renderResolveRow(pr));
    if (queueForm && queueForm.ref === pr.ref && (pr.can_publish || pr.can_repost)) rows.push(renderPublishForm(pr));
    rows.forEach((row, at) => {
      if (index % 2 === 0) row.classList.add("tint");
      if (at > 0) row.classList.add("follows");
      if (at < rows.length - 1) row.classList.add("followed");
    });
    body.append(...rows);
  });
  return body;
}

function agoWords(ms) {
  const seconds = Math.max(0, Math.round(ms / 1000));
  if (seconds < 60) return seconds + " s ago";
  if (seconds < 3600) return Math.floor(seconds / 60) + " min ago";
  return Math.floor(seconds / 3600) + " h ago";
}

const SLACK_FAILURES_SHOWN = 3;
const SLACK_SILENCE_MS = 20 * 60_000;

function mapQueueToFreshness(queue, now) {
  const parts = [];
  const github = queue.github;
  if (github && github.ok_at) {
    const stale = now - github.ok_at > github.stale_s * 1000;
    const why = queue.error || "read every " + github.every_s + " s";
    parts.push({ text: "GitHub read " + agoWords(now - github.ok_at) + (stale ? ", stale" : ""), stale, why, short: "GitHub stale" });
  } else if (github) {
    parts.push({ text: "GitHub not read yet", stale: Boolean(queue.error), pending: true, why: queue.error, short: "GitHub not read" });
  }
  const slack = queue.slack;
  if (slack && slack.enabled) {
    // One failed read is noise the next read fixes; only a run of them, or a long silence, is worth their eye.
    const read = slack.ok_at ? agoWords(now - slack.ok_at) : null;
    const failing = (slack.failures || 0) >= SLACK_FAILURES_SHOWN || (Boolean(slack.ok_at) && now - slack.ok_at > SLACK_SILENCE_MS);
    const how = slack.mode === "connector" ? "read through the Slack connector every " + slack.every_s / 60 + " min, as there is no token" : "read with the token every minute";
    let text = read ? "Slack read " + read : "Slack not read yet";
    const pending = !read;
    if (failing) text = "Slack reads failing" + (read ? ", last good " + read : "");
    parts.push({ text, stale: failing, pending, short: "Slack reads failing", why: how + (failing && slack.error ? "; last error: " + slack.error : "") });
  }
  return parts;
}

// Only a stale source says so in words, and those words do not count seconds; the times live in the dot's tooltip.
function renderQueueFreshness(queue) {
  const box = document.getElementById("queue-fresh");
  const parts = mapQueueToFreshness(queue, state.now);
  const stale = parts.filter((part) => part.stale);
  const level = stale.length ? "stale" : parts.length && !parts.some((part) => part.pending) ? "fresh" : "";
  const alive = el("span", "alive " + level);
  alive.title = parts.map((part) => part.text + (part.why ? " (" + part.why + ")" : "")).join("\n");
  const words = stale.map((part) => part.short);
  const signature = JSON.stringify([alive.className, words]);
  if (box.dataset.shown === signature) {
    box.lastChild.title = alive.title;
    return;
  }
  box.dataset.shown = signature;
  box.replaceChildren();
  if (words.length) box.append(el("span", "stale", words.join(" · ")));
  box.append(alive);
}

function renderQueue() {
  const queue = state.reviews;
  const on = Boolean(queue && queue.enabled);
  const box = showSection("queue", on ? 1 : 0);
  if (on) renderQueueFreshness(queue);
  const attention = state.attention;
  const priority = document.getElementById("priority");
  priority.textContent = attention.priority.length ? "Priority: " + attention.priority.map((p) => p.name).join(", then ") : "";
  priority.title = attention.priority.map((p) => p.name + ": " + p.issue_keys.join(", ")).join("\n");
  if (!on || !changed("queue", { prs: queue.prs, error: queue.error, dry_run: queue.dry_run, ranking: attention.ranking, sort: queueSort, form: queueForm })) return;
  const previous = box.querySelector(".tablewrap");
  const scrolled = previous ? previous.scrollLeft : 0;
  box.replaceChildren();
  if (queue.prs.length) {
    const table = el("table", "pipeline");
    const head = el("tr");
    const columns = el("colgroup");
    for (const [key, name] of QUEUE_COLUMNS) {
      columns.append(el("col", key));
      head.append(renderQueueHead(key, name));
    }
    table.append(columns);
    const thead = el("thead");
    thead.append(head);
    table.append(thead);
    let groups = 0;
    for (const [group, title] of QUEUE_GROUPS) {
      const prs = queue.prs.filter((pr) => pr.group === group);
      if (prs.length) table.append(renderQueueGroup(title, sortQueueGroup(prs, queueSort), groups++ === 0));
    }
    const wrap = el("div", "tablewrap");
    wrap.append(table);
    box.append(wrap);
    wrap.scrollLeft = scrolled;
    if (queueSortFocus) {
      // The click rebuilt the header, so the keyboard user's focus moves to the new button.
      const target = wrap.querySelector('[data-sort="' + queueSortFocus + '"]');
      if (target) target.focus();
    }
    queueSortFocus = null;
  } else if (!queue.error) {
    box.append(el("div", "quiet", "No open PRs."));
  }
  if (queue.error) box.append(el("div", "quiet", "GitHub is not answering: " + queue.error));
  const rules = queueFold("rules", queue.dry_run || queue.chat === "none" ? "How this list works · Publish posts nothing" : "How this list works");
  for (const rule of queue.rules) rules.append(el("div", "quiet", rule));
  box.append(rules);
}

function watchAgo(ms) {
  const minutes = Math.max(0, Math.floor(ms / 60_000));
  if (minutes < 1) return "just now";
  return (minutes < 120 ? minutes + " min" : Math.floor(minutes / 60) + " h") + " ago";
}

function mapWatcherToLine(watcher, now) {
  const ran = watcher.last_run_at ? watchAgo(now - watcher.last_run_at) : "";
  const summary = watcher.summary ? ", " + watcher.summary : "";
  const words = {
    ok: "last sweep " + ran + summary,
    failed: "last sweep failed " + ran + summary,
    stale: "no sweep for " + ran.replace(/ ago$/, ""),
  }[watcher.state] || watcher.why || "no status";
  const tip = [];
  if (watcher.last_run_at) tip.push("Last sweep " + fullTime(watcher.last_run_at) + (watcher.status === "failed" ? ", failed" : ""));
  if (watcher.state === "stale" && watcher.summary) tip.push("It said: " + watcher.summary);
  if (watcher.detail) tip.push(watcher.detail);
  if (watcher.stale_after_min) tip.push("Turns red after " + watcher.stale_after_min + " min without a sweep");
  if (watcher.why) tip.push(watcher.why);
  tip.push("Status file: " + watcher.path);
  return { name: watcher.name, words, bad: watcher.state !== "ok", tip: tip.join("\n") };
}

// Ages count from one shared minute mark, so every pill's words change together, at most once a minute.
function renderWatchers() {
  const minute = Math.floor(state.now / 60_000) * 60_000;
  const lines = (state.watchers || []).map((watcher) => mapWatcherToLine(watcher, minute));
  const box = document.getElementById("watchers");
  box.hidden = lines.length === 0;
  if (box.children.length !== lines.length) box.replaceChildren(...lines.map(() => el("span", "watch")));
  lines.forEach((line, index) => {
    const pill = box.children[index];
    const signature = JSON.stringify(line);
    if (pill.dataset.shown === signature) return;
    pill.dataset.shown = signature;
    pill.className = "watch" + (line.bad ? " bad" : "");
    pill.title = line.tip;
    const label = el("span", "label");
    label.append(el("b", null, line.name), ": " + line.words);
    pill.replaceChildren(el("span", "dot tiny " + (line.bad ? "stuck" : "working")), label);
  });
}

const RENDERERS = [renderNeeds, renderAsks, renderQueue, renderLeads, renderRoom, renderResources, renderWatchers, renderVerdict];

async function refresh() {
  try {
    const response = await fetch("/api/guild");
    if (!response.ok) throw new Error("status " + response.status);
    state = await response.json();
    lastUpdate = Date.now();
    offline = false;
    mismatch = false;
  } catch (error) {
    offline = true;
    renderVerdict();
    return;
  }
  try {
    keepReaderInPlace(() => {
      for (const render of RENDERERS) render();
    });
  } catch (error) {
    mismatch = true;
    renderVerdict();
  }
}

document.getElementById("compose").addEventListener("submit", async (event) => {
  event.preventDefault();
  const input = document.getElementById("text");
  const text = input.value.trim();
  if (!text) return;
  const done = await post("/api/room", { text, reply_to: replyTo });
  if (done.ok) {
    input.value = "";
    setReply(null);
    setStatus("sent to " + done.detail);
    refresh();
  } else {
    setStatus(done.detail || "not sent");
  }
});

document.getElementById("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) {
    document.getElementById("compose").requestSubmit();
  }
});

refresh();
setInterval(refresh, POLL_MS);
setInterval(renderVerdict, 1000);
</script>
