<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 316" width="800" height="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Every signal that needs you goes through your priorities and comes out as a ranked list of three</title>
  <style>
    .ink { fill: #1c1c1a; } .muted { fill: #6e6e68; }
    .work { fill: #e3f1ee; } .wait { fill: #fbf0cf; } .stuck { fill: #f7dcd8; } .lost { fill: #e9e9e6; }
    .box { fill: #f1f1ee; } .core { fill: #0f6b66; } .coreink { fill: #ffffff; } .soft { fill: #e3f1ee; }
    .accent { fill: #0f6b66; } .line { stroke: #6e6e68; fill: none; stroke-width: 2; } .arrow { fill: #6e6e68; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; } .muted { fill: #9198a1; }
      .work { fill: #133a36; } .wait { fill: #3d3416; } .stuck { fill: #4a2420; } .lost { fill: #2a2f36; }
      .box { fill: #21262d; } .core { fill: #1f8a83; } .soft { fill: #133a36; }
      .accent { fill: #4cc2b8; } .line { stroke: #9198a1; } .arrow { fill: #9198a1; }
    }
  </style>
  <rect x="0" y="0" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="21" class="ink" font-size="13" font-weight="600" text-anchor="middle">question from an agent</text>
  <rect x="0" y="40" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="61" class="ink" font-size="13" font-weight="600" text-anchor="middle">PR ready for review</text>
  <rect x="0" y="80" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="101" class="ink" font-size="13" font-weight="600" text-anchor="middle">CI red</text>
  <rect x="0" y="120" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="141" class="ink" font-size="13" font-weight="600" text-anchor="middle">prod alert</text>
  <rect x="0" y="160" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="181" class="ink" font-size="13" font-weight="600" text-anchor="middle">agent idle 20 min</text>
  <rect x="0" y="200" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="221" class="ink" font-size="13" font-weight="600" text-anchor="middle">colleague comment</text>
  <rect x="0" y="240" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="261" class="ink" font-size="13" font-weight="600" text-anchor="middle">deploy needs OK</text>
  <rect x="0" y="280" width="220" height="32" rx="6" class="box"/>
  <text x="110" y="301" class="ink" font-size="13" font-weight="600" text-anchor="middle">dream proposes a rule</text>
  <path d="M236 142.0 L258 156.0 L236 170.0 Z" class="arrow"/>
  <rect x="274" y="100.0" width="200" height="112" rx="10" class="core"/>
  <text x="374" y="144.0" class="coreink" font-size="16" font-weight="700" text-anchor="middle">Your priorities</text>
  <text x="374" y="168.0" class="coreink" font-size="14" font-weight="400" text-anchor="middle">set with Right Hand</text>
  <text x="374" y="238.0" class="accent" font-size="12" font-weight="400" text-anchor="middle">“checkout first, then search,</text>
  <text x="374" y="254.0" class="accent" font-size="12" font-weight="400" text-anchor="middle">then mobile”</text>
  <path d="M490 142.0 L512 156.0 L490 170.0 Z" class="arrow"/>
  <rect x="528" y="74.0" width="272" height="44" rx="8" class="wait"/>
  <text x="546" y="102.0" class="ink" font-size="14" font-weight="600" text-anchor="start">(1)  Answer: deploy to staging?</text>
  <rect x="528" y="130.0" width="272" height="44" rx="8" class="soft"/>
  <text x="546" y="158.0" class="ink" font-size="14" font-weight="600" text-anchor="start">(2)  Review: checkout fix</text>
  <rect x="528" y="186.0" width="272" height="44" rx="8" class="soft"/>
  <text x="546" y="214.0" class="ink" font-size="14" font-weight="600" text-anchor="start">(3)  Review: search ranking</text>
  <text x="530" y="268.0" class="accent" font-size="15" font-weight="700" text-anchor="start">That's all you look at.</text>
</svg>
